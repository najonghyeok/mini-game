rame);\n  }\n  function tick(dt) {\n    var sim = S.sim, pct = sim.deadArea / sim.totalArea, need = needFor(S.si);\n    if (S.phase === 'flying' && !C.activeShots(sim)) { S.phase = 'settle'; S.wait = 0; updateHud(); }\n    if (S.phase === 'settle') {\n      S.wait += dt;\n      var calm = C.motion(sim) \u003c 0.35;\n      if (pct >= need) { if ((calm && S.wait > 0.8) || S.wait > 3) finish(true); }\n      else if (S.shotsLeft > 0) { if (S.wait > 0.6) { S.phase = 'ready'; newWind(); updateHud(); } }\n      else if ((calm && S.wait > 1) || S.wait > 4) finish(false);\n    }\n    if (S.phase === 'ready' && pct >= need && C.motion(sim) \u003c 0.35) finish(true);\n  }\n\n  resize();\n  showMap();\n  requestAnimationFrame(frame);\n})();\n\u003c/script>\n\u003cscript>if (window.parent !== window) document.getElementById('m-launch').hidden = false;\u003c/script>\n\u003c/body>\n\u003c/html>\n", kb: "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>빌딩 베기\u003c/title>\n\u003cstyle>\n:root{--ink:#1D2330;--paper:#EEF2F5;--y:#FFC21A;--red:#E8473B;--dim:#6B7482;--line:rgba(29,35,48,.14);\n  --font:\"Pretendard\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",\"Noto Sans KR\",system-ui,sans-serif}\n*{box-sizing:border-box}\nhtml,body{height:100%;margin:0}\nbody{background:#1D2330;color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;\n  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible{outline:3px solid var(--y);outline-offset:2px}\nbutton:disabled{opacity:.4;cursor:default}\n[hidden]{display:none!important}\n#hud{display:flex;align-items:center;gap:16px;padding:8px 14px;background:var(--paper);border-bottom:3px solid var(--ink);flex-wrap:wrap}\n#hud .name b{display:block;font-size:17px;font-weight:900}\n#hud .name small{color:var(--dim);font-size:12px}\n.meter{flex:1;min-width:160px}\n.meter small{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}\n.track{height:10px;background:rgba(29,35,48,.12);border-radius:2px;margin-top:4px;overflow:hidden}\n.track i{display:block;height:100%;background:var(--ink);width:0}\n#h-gauge{background:var(--y)}\n.stat{display:flex;flex-direction:column;font-size:11px;color:var(--dim)}\n.stat b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}\n#h-hearts{font-size:18px;letter-spacing:2px;color:var(--red)}\n#h-hearts i{font-style:normal;color:rgba(29,35,48,.2)}\n#h-hearts i.on{color:var(--red)}\n.ghost{background:none;border:2px solid var(--ink);border-radius:3px;padding:5px 10px;font-size:13px;font-weight:700}\n#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}\ncanvas{display:block;touch-action:none}\n/* 패널 */\n.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(29,35,48,.55);overflow:auto}\n.card{background:var(--paper);border:3px solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 var(--ink);padding:24px 26px;width:min(520px,100%)}\nh1{font-size:clamp(44px,8vw,80px);font-weight:900;margin:0;line-height:.95;letter-spacing:-.04em}\nh1 span{display:block;transform:skewX(-8deg);transform-origin:left}\n.lead{color:#3C4452;line-height:1.6;margin:14px 0 18px;font-size:15px}\n.primary{background:var(--y);border:3px solid var(--ink);border-radius:3px;padding:12px 20px;font-weight:900;font-size:17px;box-shadow:4px 4px 0 var(--ink)}\n.primary:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}\n.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}\n.keys{font-size:13px;color:#3C4452;line-height:1.8;margin-top:16px;border-top:2px solid var(--line);padding-top:12px}\nkbd{font-family:inherit;font-size:12px;border:2px solid var(--ink);border-bottom-width:3px;border-radius:3px;padding:0 5px;background:#fff}\n.best{font-size:13px;color:var(--dim)}\nh2{margin:0 0 4px;font-size:30px;font-weight:900}\n.coins{font-weight:900;font-variant-numeric:tabular-nums}\n.upg{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--line)}\n.upg .t{flex:1}\n.upg .t b{display:block}\n.upg .t small{color:var(--dim);font-size:12px}\n.pips{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}\n.pips i{width:12px;height:6px;background:rgba(29,35,48,.15)}\n.pips i.on{background:var(--ink)}\n.upg button{min-width:96px;background:#fff;border:2px solid var(--ink);border-radius:3px;padding:8px;font-weight:800;font-variant-numeric:tabular-nums}\n.res div{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}\n/* 무기 */\n.wpn{display:flex;gap:14px;align-items:center;padding:12px 0 14px;border-top:2px solid var(--line)}\n.wpn canvas{width:96px;height:96px;background:#1D2330;border-radius:4px;flex:none}\n.wi{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}\n.wi b{font-size:18px;font-weight:900}\n.wi small{color:var(--dim);font-size:12px;line-height:1.4}\n#s-wbuy{font-size:14px;padding:9px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}\n#s-wbuy small{font-weight:600;font-size:11px;color:#3C4452}\n/* 모바일 버튼 */\n#pad{display:none;justify-content:space-between;gap:8px;padding:8px 10px 12px;background:#1D2330}\n#pad .grp{display:flex;gap:8px}\n#pad button{width:64px;height:64px;border-radius:50%;border:3px solid var(--paper);background:rgba(238,242,245,.08);color:var(--paper);font-weight:800;font-size:14px;touch-action:none}\n#pad button.big{background:var(--y);color:var(--ink);border-color:var(--y)}\n#pad button.on{background:var(--paper);color:var(--ink)}\n@media (hover:none),(max-width:760px){#pad{display:flex}}\n@media (max-width:760px){#hud{gap:8px;padding:6px 10px}.meter{flex-basis:40%}#hud .name b{font-size:15px}}\n@media (max-width:520px){#pad{padding:6px}#pad .grp{gap:5px}#pad button{width:min(52px,13.5vw);height:min(52px,13.5vw);font-size:12px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader id=\"hud\" hidden>\n  \u003cdiv class=\"name\">\u003cb id=\"h-name\">\u003c/b>\u003csmall id=\"h-sub\">\u003c/small>\u003c/div>\n  \u003cdiv class=\"meter\">\u003csmall id=\"h-floors\">\u003c/small>\u003cdiv class=\"track\">\u003ci id=\"h-bar\">\u003c/i>\u003c/div>\u003c/div>\n  \u003cdiv class=\"meter\" style=\"max-width:160px\">\u003csmall id=\"h-glabel\">필살기\u003c/small>\u003cdiv class=\"track\">\u003ci id=\"h-gauge\">\u003c/i>\u003c/div>\u003c/div>\n  \u003cdiv id=\"h-hearts\">\u003c/div>\n  \u003cdiv class=\"stat\">점수\u003cb id=\"h-score\">0\u003c/b>\u003c/div>\n  \u003cdiv class=\"stat\">돈\u003cb id=\"h-coins\">0\u003c/b>\u003c/div>\n  \u003cbutton class=\"ghost\" id=\"b-pause\">일시정지\u003c/button>\n\u003c/header>\n\u003cmain id=\"stage\">\n  \u003ccanvas id=\"cv\" aria-label=\"게임 화면\">\u003c/canvas>\n  \u003csection class=\"panel\" id=\"p-title\">\n    \u003cdiv class=\"card\">\n      \u003ch1>\u003cspan>빌딩\u003c/span>\u003cspan>베기\u003c/span>\u003c/h1>\n      \u003cp class=\"lead\">세계에서 가장 높은 건물들이 하늘에서 떨어집니다. 아래층부터 부숴 없애세요. 땅에 내려앉은 건물은 옆에서 부수면 됩니다. 번 돈으로 장비를 강화할 수 있습니다.\u003c/p>\n      \u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"t-start\">철거 시작\u003c/button>\u003cbutton class=\"ghost\" id=\"t-shop\">장비 강화\u003c/button>\u003cbutton class=\"ghost\" id=\"t-launch\" hidden>게임 선택\u003c/button>\u003cspan class=\"best\" id=\"t-best\">\u003c/span>\u003c/div>\n      \u003cdiv class=\"keys\">\u003ckbd>←\u003c/kbd>\u003ckbd>→\u003c/kbd> 이동 &nbsp; \u003ckbd>↑\u003c/kbd> 또는 \u003ckbd>Space\u003c/kbd> 점프 &nbsp; \u003ckbd>Z\u003c/kbd> 부수기\u003cbr>\u003ckbd>X\u003c/kbd> 누르고 있으면 막기 (건물을 튕겨 올림) &nbsp; \u003ckbd>C\u003c/kbd> 필살기\u003cbr>\u003ckbd>Shift\u003c/kbd> 또는 방향키 두 번: 대시 (무적) &nbsp; 15연타 이상이면 피버 타임\u003cbr>떨어지는 큰 잔해에 맞으면 잠깐 기절합니다. 막기나 대시로 피하세요.\u003cbr>건물이 머리 위로 떨어져 깔릴 때만 체력이 줄어듭니다. 땅에 닿는 건 괜찮아요.\u003c/div>\n    \u003c/div>\n  \u003c/section>\n  \u003csection class=\"panel\" id=\"p-shop\" hidden>\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"row\" style=\"margin:0 0 6px;justify-content:space-between\">\u003ch2 id=\"s-title\">장비 강화\u003c/h2>\u003cspan class=\"coins\" id=\"s-coins\">\u003c/span>\u003c/div>\n      \u003cdiv id=\"s-weapon\" class=\"best\">\u003c/div>\n      \u003cdiv class=\"wpn\">\u003ccanvas id=\"s-wcv\" width=\"120\" height=\"120\">\u003c/canvas>\u003cdiv class=\"wi\">\u003cb id=\"s-wname\">\u003c/b>\u003csmall id=\"s-wperk\">\u003c/small>\u003cbutton class=\"primary\" id=\"s-wbuy\">\u003c/button>\u003c/div>\u003c/div>\n      \u003cdiv id=\"s-list\">\u003c/div>\n      \u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"s-go\">\u003c/button>\u003cbutton class=\"ghost\" id=\"s-home\">처음 화면\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n  \u003csection class=\"panel\" id=\"p-over\" hidden>\n    \u003cdiv class=\"card\">\n      \u003ch2 id=\"o-title\">깔렸습니다\u003c/h2>\n      \u003cdiv class=\"res\" id=\"o-res\">\u003c/div>\n      \u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"o-retry\">다시 도전\u003c/button>\u003cbutton class=\"ghost\" id=\"o-shop\">장비 강화\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n  \u003csection class=\"panel\" id=\"p-pause\" hidden>\n    \u003cdiv class=\"card\">\u003ch2>일시정지\u003c/h2>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"pa-go\">계속하기\u003c/button>\u003cbutton class=\"ghost\" id=\"pa-home\">그만두기\u003c/button>\u003c/div>\u003c/div>\n  \u003c/section>\n\u003c/main>\n\u003cfooter id=\"pad\" hidden>\n  \u003cdiv class=\"grp\">\u003cbutton data-k=\"left\" aria-label=\"왼쪽\">◀\u003c/button>\u003cbutton data-k=\"right\" aria-label=\"오른쪽\">▶\u003c/button>\u003cbutton data-k=\"dash\">대시\u003c/button>\u003c/div>\n  \u003cdiv class=\"grp\">\u003cbutton data-k=\"special\" id=\"pad-sp\">필살\u003c/button>\u003cbutton data-k=\"guard\">막기\u003c/button>\u003cbutton data-k=\"jump\">점프\u003c/button>\u003cbutton data-k=\"attack\" class=\"big\">부수기\u003c/button>\u003c/div>\n\u003c/footer>\n\u003cscript>\n(function () {\n  var W = 960, H = 640, GY = 590, ROWM = 15, ROWPX = 30, WS = 3.1;\n  function one(w) { return [[-w / 2, w / 2]]; }\n  // 스테이지: 마천루 철거단과 같은 13개 건물 + 히든(MAP 교향곡 타워), 같은 순서\n  var BUILDINGS = [\n    { id: '63', name: '63빌딩', city: '서울', height: 249, color: '#D9A441', glass: '#F7DC8F',\n      shape: function (h) { return one(58 - 12 * h / 249); } },\n    { id: 'mbs', name: '마리나 베이 샌즈', city: '싱가포르', height: 200, color: '#D6CFBF', glass: '#EAF2F8',\n      shape: function (h) { if (h > 185) return one(250); return [[-95, -63], [-16, 16], [63, 95]]; } },\n    { id: 'chrysler', name: '크라이슬러 빌딩', city: '뉴욕', height: 319, color: '#C4C7CC', glass: '#EEF0F3',\n      shape: function (h) {\n        if (h \u003c 60) return one(62); if (h \u003c 170) return one(50); if (h \u003c 240) return one(36);\n        if (h \u003c 282) return one(30 - 16 * (h - 240) / 42); return one(4);\n      } },\n    { id: 'park432', name: '432 파크 애비뉴', city: '뉴욕', height: 426, color: '#E4DFD6', glass: '#9FB3C8',\n      shape: function (h) { return one(44); } },\n    { id: 'willis', name: '윌리스 타워', city: '시카고', height: 527, color: '#3F4148', glass: '#8791A1',\n      shape: function (h) {\n        if (h \u003c 205) return one(69); if (h \u003c 270) return one(52); if (h \u003c 412) return one(35); if (h \u003c 442) return one(23);\n        return [[-10, -4], [4, 10]];\n      } },\n    { id: 'esb', name: '엠파이어 스테이트 빌딩', city: '뉴욕', height: 443, color: '#B5AE9F', glass: '#EDE6D4',\n      shape: function (h) { return one(h \u003c 25 ? 130 : h \u003c 90 ? 96 : h \u003c 250 ? 72 : h \u003c 320 ? 56 : h \u003c 350 ? 36 : h \u003c 381 ? 18 : 6); } },\n    { id: 'petronas', name: '페트로나스 트윈타워', city: '쿠알라룸푸르', height: 452, color: '#9FB0C2', glass: '#DFEA trail: '220,235,255', mult: 1.3, perk: '때릴 때 불꽃이 튐' },\n    { name: '황금 곡괭이',       shape: 'pick',   col: '#F2C230', trail: '255,215,80',  mult: 1.6, perk: '버는 돈 +30%' },\n    { name: '화염 곡괭이',       shape: 'pick',   col: '#FF6A2A', trail: '255,120,40',  mult: 2.0, perk: '맞은 층이 불타며 계속 피해' },\n    { name: '빙결 곡괭이',       shape: 'pick',   col: '#7FDBFF', trail: '140,220,255', mult: 2.4, perk: '맞은 건물이 얼어서 천천히 떨어짐' },\n    { name: '번개 곡괭이',       shape: 'pick',   col: '#FFF06A', trail: '255,250,120', mult: 2.9, perk: '남는 피해가 위층으로 번개처럼 튐' },\n    { name: '대지의 해머',       shape: 'hammer', col: '#9A7550', trail: '220,170,110', mult: 3.5, perk: '충격파로 공격 범위가 넓어짐' },\n    { name: '플라즈마 커터',     shape: 'blade',  col: '#FF4FD8', trail: '255,90,220',  mult: 4.2, perk: '공격이 훨씬 높이 닿음' },\n    { name: '용의 곡괭이',       shape: 'pick2',  col: '#D22B2B', trail: '255,60,40',   mult: 5.0, perk: '필살기가 훨씬 많은 층을 태움' },\n    { name: '은하 곡괭이',       shape: 'pick2',  col: '#9B7BFF', trail: '170,140,255', mult: 6.0, perk: '필살기 충전 1.5배' },\n    { name: '전설의 무지개 드릴', shape: 'drill',  col: 'rainbow', trail: 'rainbow',     mult: 7.5, perk: '모든 능력 + 크리티컬 확률 2배' }\n  ];\n  function wcost(t) { return Math.round(120 * Math.pow(1.85, t) / 10) * 10; }\n  function wt() { return save.weapon || 0; }\n  function has(t) { return wt() >= t; }\n  function rainbow(a) { return 'hsla(' + ((performance.now() / 6) % 360) + ',95%,62%,' + (a == null ? 1 : a) + ')'; }\n  function wcol() { var w = WEAPONS[wt()]; return w.col === 'rainbow' ? rainbow() : w.col; }\n  function wtrail(a) { var w = WEAPONS[wt()]; return w.trail === 'rainbow' ? rainbow(a) : 'rgba(' + w.trail + ',' + a + ')'; }\n  function atkCd(l) { return 16 - l * 2; }\n  function upgCost(u, l) { return Math.round(u.base * Math.pow(1.7, l)); }\n\n  var DEF = { coins: 0, best: 0, atk: 0, rate: 0, hearts: 0, guard: 0, charge: 0, weapon: 0 };\n  var save = JSON.parse(JSON.stringify(DEF));\n  try { var sv = JSON.parse(localStorage.getItem('kirubiru-save') || 'null'); if (sv) for (var k in DEF) if (sv[k] != null) save[k] = sv[k]; } catch (e) {}\n  function persist() { try { localStorage.setItem('kirubiru-save', JSON.stringify(save)); } catch (e) {} }\n\n  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');\n  var $ = function (id) { return document.getElementById(id); };\n  var FONT = getComputedStyle(document.body).fontFamily;\n\n  function resize() {\n    var st = $('stage'), s = Math.min(st.clientWidth / W, st.clientHeight / H);\n    var cw = Math.floor(W * s), ch = Math.floor(H * s);\n    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';\n    var dpr = Math.min(window.devicePixelRatio || 1, 2);\n    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);\n    G.px = cv.width / W;\n  }\n  window.addEventListener('resize', resize);\n\n  // ---------- 상태 ----------\n  var G = { mode: 'title', px: 1 };\n  var keys = {};\n\n  function makeBuilding(idx, loop) {\n    var d = BUILDINGS[idx], rm = d.rowm || ROWM, n = Math.ceil(d.height / rm), rows = [], lv = lvOf(idx);\n    var hpBase = (1 + lv * 0.55) * Math.pow(2.2, loop);\n    for (var r = 0; r \u003c n; r++) {\n      var ivs = d.shape(Math.min((r + 0.5) * rm, d.height - 0.01)).map(function (iv) { return [iv[0] * d.ws, iv[1] * d.ws]; });\n      var width = ivs.reduce(function (s, iv) { return s + iv[1] - iv[0]; }, 0);\n      var hp = hpBase * (0.55 + 0.45 * Math.min(1, width / 250));\n      rows.push({ ivs: ivs, hp: hp, max: hp, flash: 0 });\n    }\n    var cx = W / 2 + (idx % 2 ? 1 : -1) * Math.min(80, lv * 25) * (loop % 2 ? -1 : 1);\n    return { d: d, idx: idx, rows: rows, cut: 0, bottom: 80, vy: 0, cx: cx, freeze: 0, sway: 0, landed: false,\n      term: (1.5 + lv * 0.25) * (1 + loop * 0.35), grav: 0.12 + lv * 0.012 + loop * 0.03 };\n  }\n\n  function newRun() {\n    G.hearts = 3 + save.hearts; G.maxHearts = G.hearts;\n    G.score = 0; G.runCoins = 0; G.idx = 0; G.loop = 0; G.gauge = 0; G.floorsCut = 0;\n    G.p = { x: W / 2 - 150, y: GY, vx:
